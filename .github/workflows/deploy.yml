name: Deploy to Aliyun

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/dongruiyang2024/api-product
  # 与当前分支已合并的上游发布基线保持一致。
  # 上游 v0.2.7 标签内的 VERSION 文件仍为 0.2.5，不能直接取用。
  SYNC_BASE_VERSION: 0.2.7

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Require successful CI for the current main commit
        id: candidate
        uses: actions/github-script@v8
        with:
          script: |
            const sha = context.payload.workflow_run?.head_sha ?? context.sha;
            const { data: main } = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
            if (sha !== main.commit.sha) {
              throw new Error('Deployment candidate is no longer the current main commit');
            }
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'backend-ci.yml', head_sha: sha,
              branch: 'main', event: 'push', per_page: 100,
            });
            const latest = data.workflow_runs.sort((a, b) => b.id - a.id)[0];
            if (!latest || latest.status !== 'completed' || latest.conclusion !== 'success') {
              throw new Error(`Commit ${sha} must pass the complete CI workflow before deployment`);
            }
            core.setOutput('sha', sha);
            core.exportVariable('IMAGE_TAG', sha);

      - name: Checkout verified commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.candidate.outputs.sha }}

      - name: Resolve image metadata
        id: image
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SYNC_BASE_VERSION" ]; then
            echo "::error::SYNC_BASE_VERSION is empty"
            exit 1
          fi
          short_sha="${IMAGE_TAG::12}"
          echo "version=${SYNC_BASE_VERSION}-oneapi.${short_sha}" >> "$GITHUB_OUTPUT"
          echo "compose_file=docker-compose.${SYNC_BASE_VERSION}.yml" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
            COMMIT=${{ steps.candidate.outputs.sha }}
            NPM_CONFIG_REGISTRY=${{ vars.NPM_CONFIG_REGISTRY }}
            ALPINE_MIRROR=${{ vars.ALPINE_MIRROR }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.candidate.outputs.sha }}
            ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.version }}

      - name: Reject superseded deployment before accessing production
        uses: actions/github-script@v8
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        with:
          script: |
            const { data } = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
            if (data.commit.sha !== process.env.CANDIDATE_SHA) {
              throw new Error('main advanced during the image build; deploy its successful CI run instead');
            }

      - name: Prepare SSH
        env:
          ALIYUN_DEPLOY_BUNDLE: ${{ secrets.ALIYUN_DEPLOY_KEY }}
        run: |
          set -euo pipefail

          bundle_file="$RUNNER_TEMP/aliyun-deploy.env"
          printf '%s\n' "$ALIYUN_DEPLOY_BUNDLE" > "$bundle_file"

          get_config() {
            key="$1"
            default="${2:-}"
            value="$(sed -n "s/^${key}=//p" "$bundle_file" | head -n 1)"
            if [ -z "$value" ]; then
              value="$default"
            fi
            printf '%s' "$value"
          }

          ALIYUN_HOST="$(get_config ALIYUN_HOST)"
          ALIYUN_USER="$(get_config ALIYUN_USER root)"
          ALIYUN_PORT="$(get_config ALIYUN_PORT 22)"
          ALIYUN_DEPLOY_PATH="$(get_config ALIYUN_DEPLOY_PATH /root/service/sub2api)"

          if [ -z "$ALIYUN_HOST" ]; then
            echo "::error::ALIYUN_DEPLOY_KEY must include ALIYUN_HOST=your_server_ip"
            exit 1
          fi

          mkdir -p ~/.ssh
          sed -n '/^ALIYUN_DEPLOY_KEY=/,$p' "$bundle_file" \
            | sed '1s/^ALIYUN_DEPLOY_KEY=//' \
            | sed "1s/^'//; \$s/'$//" \
            > ~/.ssh/aliyun_deploy
          chmod 600 ~/.ssh/aliyun_deploy

          if ! grep -q -- '-----BEGIN OPENSSH PRIVATE KEY-----' ~/.ssh/aliyun_deploy; then
            echo "::error::ALIYUN_DEPLOY_KEY must include a full OPENSSH private key after ALIYUN_DEPLOY_KEY="
            exit 1
          fi

          {
            echo "ALIYUN_HOST=$ALIYUN_HOST"
            echo "ALIYUN_USER=$ALIYUN_USER"
            echo "ALIYUN_PORT=$ALIYUN_PORT"
            echo "ALIYUN_DEPLOY_PATH=$ALIYUN_DEPLOY_PATH"
          } >> "$GITHUB_ENV"

          ssh-keyscan -T 10 -p "$ALIYUN_PORT" "$ALIYUN_HOST" >> ~/.ssh/known_hosts || \
            echo "::warning::ssh-keyscan timed out; SSH will use StrictHostKeyChecking=accept-new"

      - name: Deploy on Aliyun
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          deploy_script="$RUNNER_TEMP/deploy-aliyun.sh"
          cat > "$deploy_script" <<'EOF'
          set -euo pipefail

          # 保留 255 给 SSH 传输故障，避免远端命令同码触发整体重试。
          trap 'status=$?; if [ "$status" -eq 255 ]; then exit 1; fi' EXIT
          docker compose version >/dev/null

          mkdir -p "$DEPLOY_PATH"
          cd "$DEPLOY_PATH"
          test -f docker-compose.prod.yml
          test -f .env

          require_explicit_env() {
            key="$1"
            if ! grep -Eq "^${key}=(true|false)$" .env; then
              echo "Missing explicit ${key}=true|false in $DEPLOY_PATH/.env" >&2
              exit 1
            fi
          }

          require_explicit_env SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP
          require_explicit_env SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS

          printf '%s' "$BASE_COMPOSE_B64" | base64 -d > "$BASE_COMPOSE_FILE"

          cat > docker-compose.ghcr.yml <<YAML
          services:
            sub2api:
              image: ${IMAGE_NAME}:${IMAGE_TAG}
              pull_policy: always
              # 普通 InitEnt 的初始化预算为 600 秒；最后一层防止生产覆盖文件缩短宽限。
              healthcheck:
                start_period: 600s
          YAML

          COMPOSE_FILES="-f ${BASE_COMPOSE_FILE} -f docker-compose.prod.yml -f docker-compose.ghcr.yml"
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          docker compose $COMPOSE_FILES config --quiet
          docker compose $COMPOSE_FILES pull sub2api
          # 首次跨版本升级只替换应用容器，避免 Compose 配置变化同时
          # 重建正在承载生产数据的 PostgreSQL 与 Redis。
          docker compose $COMPOSE_FILES up -d --no-deps sub2api
          docker compose $COMPOSE_FILES ps

          container_id="$(docker compose $COMPOSE_FILES ps -q sub2api)"
          if [ -z "$container_id" ]; then
            echo "sub2api container was not created" >&2
            exit 1
          fi

          wait_for_container "$container_id" || {
            status=$?
            docker compose $COMPOSE_FILES logs --tail=200 sub2api
            exit "$status"
          }
          EOF

          deploy_payload="$RUNNER_TEMP/deploy-aliyun-with-env.sh"
          BASE_COMPOSE_B64="$(base64 < deploy/docker-compose.yml | tr -d '\n')"
          {
            printf 'export DEPLOY_PATH=%q\n' "$ALIYUN_DEPLOY_PATH"
            printf 'export IMAGE_NAME=%q\n' "$IMAGE_NAME"
            printf 'export IMAGE_TAG=%q\n' "$IMAGE_TAG"
            printf 'export BASE_COMPOSE_FILE=%q\n' "${{ steps.image.outputs.compose_file }}"
            printf 'export BASE_COMPOSE_B64=%q\n' "$BASE_COMPOSE_B64"
            printf 'export GHCR_USERNAME=%q\n' "$GHCR_USERNAME"
            printf 'export GHCR_TOKEN=%q\n' "$GHCR_TOKEN"
            cat deploy/wait-for-container.sh
            cat "$deploy_script"
          } > "$deploy_payload"

          bash deploy/ssh-retry.sh "$deploy_payload" ssh \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -o TCPKeepAlive=yes \
            -o BatchMode=yes \
            -i ~/.ssh/aliyun_deploy \
            -p "$ALIYUN_PORT" \
            "$ALIYUN_USER@$ALIYUN_HOST" "bash -se"
